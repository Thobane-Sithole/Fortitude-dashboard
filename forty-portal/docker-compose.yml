version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: forty_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitss
      POSTGRES_PASSWORD: fitss_secret_2026
      POSTGRES_DB: forty_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./apps/api/src/migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitss -d forty_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: forty_portal_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: thobane@fitss.co.za
      PGADMIN_DEFAULT_PASSWORD: fitss_admin_2026
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
